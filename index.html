<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            background-color: #0f1115;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
        }
        /* 標頭改為淡一點的血紅色 */
        h1 { color: #da3633; margin-bottom: 15px; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* 按鈕改為紅色系風格 */
        .btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            background: #b31d24;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        /* 滑鼠移上去時變亮紅 */
        .btn:hover { background: #d73a4a; }
    </style>
</head>
<body>
    <div class="card">
        <h1>歡迎認識我！</h1>
        <p>我一時興起用 Notion 寫了 <br>自介、名言收藏冊 <br>我看過的動漫以及我喜歡的演員。</p>
        
        <!-- 按鈕群組 -->
        <div class="btn-group">
            <a class="btn" href="https://www.twitch.tv/gui_ger" target="_blank">我的Twitch</a>
            <a class="btn" href="https://www.youtube.com/channel/UCSuCdGbs-KHHyvwwo8YS8GA" target="_blank">我的Youtube</a>
            <a class="btn" href="https://steamcommunity.com/profiles/76561199180388448/images/" target="_blank">Steam朋友畫作展示區</a>
            <a class="btn" href="https://tinyurl.com/3cd5885x" target="_blank">文學名言收藏冊</a>
            <a class="btn" href="https://tinyurl.com/4cmy2t4v" target="_blank">看過的動漫</a>
            <a class="btn" href="https://tinyurl.com/yz63c2mf" target="_blank">喜歡的演員</a>
        </div>
    </div>
</body>
</html>
